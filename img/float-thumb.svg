<svg width="200" height="150" viewBox="-2 -2 4 4" xmlns="http://www.w3.org/2000/svg">
    <rect x="-2" y="-2" width="4" height="4" fill="#fafafa"/>
    <!-- Absolute tolerance strip -->
    <polygon points="-2,-1.7 -2,-2.3 2,1.7 2,2.3" fill="#0D9488" fill-opacity="0.6"/>
    <!-- Relative tolerance wedges -->
    <polygon points="0,0 2,1.4 2,2.6" fill="#0D9488" fill-opacity="0.6"/>
    <polygon points="0,0 -2,-1.4 -2,-2.6" fill="#0D9488" fill-opacity="0.6"/>
    <!-- Target line -->
    <line x1="-2" y1="-2" x2="2" y2="2" stroke="#0D9488" stroke-dasharray="0.2,0.2" stroke-width="0.05" stroke-opacity="0.5"/>
</svg>
